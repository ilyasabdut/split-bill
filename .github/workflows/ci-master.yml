name: Build and Deploy Bill Splitter

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: API lint and tests
        run: |
          uv sync
          uv run ruff check api
          uv run pytest api/tests -q

      - name: Web check, tests and build
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
          bun run build

  smoke:
    name: End-to-end Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke test
        run: bash scripts/smoke.sh

  build-and-push-images:
    name: Build and Push Bill Splitter Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: self-hosted
    environment: master

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.ilyasabdut.loseyourip.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: registry.ilyasabdut.loseyourip.com/split-bill-web:latest
          # Baked into the static bundle; VITE_API_KEY must equal the API's API_KEY
          build-args: |
            VITE_FASTAPI_API_URL=${{ vars.VITE_FASTAPI_API_URL }}
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}

      - name: Build and Push FastAPI API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: registry.ilyasabdut.loseyourip.com/split-bill-api:latest

  deploy-on-vps:
    name: Deploy Bill Splitter to VPS
    needs: build-and-push-images
    runs-on: self-hosted
    environment: master

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Registry (on deployment runner/VPS)
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.ilyasabdut.loseyourip.com -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Deploy Bill Splitter Apps
        run: |
          echo "Deploying Bill Splitter on $(hostname)"

          APP_COMPOSE_DIR="/home/ubuntu/composes/split-bill"

          if [ ! -d "${APP_COMPOSE_DIR}" ]; then
            echo "ERROR: Deployment directory ${APP_COMPOSE_DIR} does not exist!"
            exit 1
          fi

          echo "Copying docker/docker-compose.yml from the repo..."
          mkdir -p "${APP_COMPOSE_DIR}/docker"
          cp docker/docker-compose.yml "${APP_COMPOSE_DIR}/docker/docker-compose.yml"

          cd "${APP_COMPOSE_DIR}"
          echo "Changed directory to $(pwd)"

          echo "Ensuring .env file exists..."
          if [ ! -f .env ]; then
            echo "ERROR: .env file not found in ${APP_COMPOSE_DIR}. Deployment requires this for configurations."
            exit 1
          fi

          COMPOSE="docker compose --env-file .env -f docker/docker-compose.yml"

          echo "Pulling latest images..."
          $COMPOSE pull web api

          echo "Restarting containers..."
          $COMPOSE up -d --no-build --force-recreate --remove-orphans

          echo "Cleaning up unused Docker images (optional)..."
          docker image prune -af

          echo "Bill Splitter deployment finished!"
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
