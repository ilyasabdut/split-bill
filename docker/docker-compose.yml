# Fixed project name: without it compose names the project after this folder ("docker"),
# and `up --remove-orphans` would touch any other stack that did the same.
name: split-bill

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: ${WEB_IMAGE:-registry.ilyasabdut.loseyourip.com/split-bill-web:latest}
    container_name: ${CONTAINER_PREFIX:-split-bill}-web
    ports:
      - "${WEB_PORT:-15173}:80"
    environment:
      - API_KEY=${API_KEY}
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: ${API_IMAGE:-registry.ilyasabdut.loseyourip.com/split-bill-api:latest}
    container_name: ${CONTAINER_PREFIX:-split-bill}-api
    ports:
      - "${API_PORT:-18000}:18000"
    environment:
      - API_KEY=${API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL_NAME=${OPENROUTER_MODEL_NAME:-mistralai/mistral-small-3.2-24b-instruct:free}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:15173}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/splitbill}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-split-bill}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-splitbill}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"  # host-only: never expose the database publicly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
