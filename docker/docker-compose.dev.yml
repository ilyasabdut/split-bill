version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: registry.ilyasabdut.loseyourip.com/split-bill-web:latest
    container_name: split-bill-web-dev
    ports:
      - "25432:3000"
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:26518}
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: registry.ilyasabdut.loseyourip.com/split-bill-api:latest
    container_name: split-bill-api-dev
    ports:
      - "26518:18000"
    environment:
      - API_KEY=${API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL_NAME=${OPENROUTER_MODEL_NAME:-mistralai/mistral-small-3.2-24b-instruct:free}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-garage:3900}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-garage}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-garage_key}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-split-bill}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-False}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:25432}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/splitbill}
    restart: unless-stopped
    depends_on:
      - redis
      - postgres

  redis:
    image: valkey/valkey:alpine3.23
    container_name: split-bill-redis-dev
    ports:
      - "27946:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: split-bill-garage-dev
    ports:
      - "28152:3900"
      - "28154:3902"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-changeme}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-admin_token_change_me}
      GARAGE_S3_API_REGION: garage
    volumes:
      - garage_data_dev:/data
      - garage_meta_dev:/meta
    command: >
      /garage
      --config /etc/garage/config.toml
      server
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: split-bill-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-splitbill}
    ports:
      - "29387:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data_dev:
  garage_data_dev:
  garage_meta_dev:
  postgres_data_dev:
