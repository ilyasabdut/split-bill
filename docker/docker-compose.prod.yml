version: "3.8"

services:
  web:
    image: registry.ilyasabdut.loseyourip.com/split-bill-web:latest
    container_name: split-bill-web
    ports:
      - "15173:3000"
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:18000}
    restart: unless-stopped
    depends_on:
      - api

  api:
    image: registry.ilyasabdut.loseyourip.com/split-bill-api:latest
    container_name: split-bill-api
    ports:
      - "18000:18000"
    environment:
      - API_KEY=${API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL_NAME=${OPENROUTER_MODEL_NAME:-mistralai/mistral-small-3.2-24b-instruct:free}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-split-bill}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-False}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:15173}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: valkey/valkey:alpine3.23
    container_name: split-bill-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:
