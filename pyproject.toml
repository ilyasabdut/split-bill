[tool.pytest.ini_options]
pythonpath = ["api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project]
name = "split-bill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.1",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "pillow>=12.1.1",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.38",
    "uvicorn>=0.34.3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "black>=25.12.0",
    "isort>=7.0.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]
